[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deploy.s.sol/Upgrade.s.sol write/read deployments/anvil.json — the single
# source of truth for addresses shared with custos-web and Envio.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# NanSigil lives in its own repo; until it is a submodule it is the sibling checkout.
allow_paths = ["../nansigil-contract"]

[fmt]
line_length = 110
tab_width = 4

[lint]
# forge-lint's ruleset (unsafe-typecast, unused-return, literal-instead-of-constant,
# calls-loop, arbitrary-send-eth, etc.) targets production-contract hygiene. Applying
# it to tests flags the standard forge-std idioms tests are supposed to use (ignoring
# a vm.prank() return, casting a known-safe literal like uint128(USDC)). Applying it
# to Deploy.s.sol/Upgrade.s.sol flags the same class of false positive for one-shot
# deploy tooling: vm.serializeX() returns nobody reads, agent wallets derived from a
# hardcoded local seed flagged as "arbitrary" send targets, a fixed 3-iteration demo
# loop flagged for unbounded-loop gas risk. Neither directory is deployed bytecode —
# src/ stays fully linted, that's where these checks earn their keep.
ignore = ["test/**/*.sol", "script/**/*.sol"]

[invariant]
runs = 256
depth = 64
# Aksi acak sering menabrak batas yang memang harus ditegakkan (allowance habis,
# saldo kurang, wallet sudah terikat). Yang diuji adalah keadaan setelah urutan yang
# berhasil, bukan apakah setiap panggilan boleh lewat.
fail_on_revert = false
