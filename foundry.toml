[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deploy.s.sol/Upgrade.s.sol write/read deployments/anvil.json — the single
# source of truth for addresses shared with custos-web and Envio.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 110
tab_width = 4

[lint]
# forge-lint's ruleset (unsafe-typecast, unused-return, literal-instead-of-constant,
# etc.) targets production-contract hygiene. Applying it to tests flags the standard
# forge-std idioms tests are supposed to use (ignoring a vm.prank() return, casting a
# known-safe literal like uint128(USDC)) — hundreds of findings that would make tests
# noisier to "fix", not safer. src/ and script/ stay fully linted.
ignore = ["test/**/*.sol"]

[invariant]
runs = 256
depth = 64
# Aksi acak sering menabrak batas yang memang harus ditegakkan (allowance habis,
# saldo kurang, wallet sudah terikat). Yang diuji adalah keadaan setelah urutan yang
# berhasil, bukan apakah setiap panggilan boleh lewat.
fail_on_revert = false
